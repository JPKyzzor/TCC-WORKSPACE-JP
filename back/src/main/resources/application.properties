spring.application.name=demo
server.port=${PORT:8080}

# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}

# LangChain4j (configuracao explicita obrigatoria)
langchain4j.google-ai-gemini.chat-model.api-key=${LANGCHAIN4J_GOOGLE_AI_GEMINI_CHAT_MODEL_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=${LANGCHAIN4J_GOOGLE_AI_GEMINI_CHAT_MODEL_MODEL_NAME:gemini-2.5-flash}
